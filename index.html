<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ТикТак — Лента видео и мемов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      background: #09090b;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1f1f23;
      border-right: 1px solid #1f1f23;
    }

    /* Верхняя панель */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      pointer-events: none;
    }

    .status-pill {
      pointer-events: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.error { background: #ef4444; }

    .feed-tabs {
      pointer-events: auto;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .feed-tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding-bottom: 4px;
      position: relative;
      transition: 0.2s;
    }

    .feed-tab.active {
      color: #fff;
    }

    .feed-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 25%;
      right: 25%;
      height: 3px;
      background: #fff;
      border-radius: 2px;
    }

    /* Экраны */
    .screen {
      flex: 1;
      height: 100%;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    /* Лента */
    #feed-container {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed-container::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      width: 100%;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    .video-bg-canvas, .video-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .meme-overlay {
      position: relative;
      z-index: 5;
      padding: 24px;
      text-align: center;
      max-width: 85%;
      pointer-events: none;
    }

    .meme-emoji {
      font-size: 64px;
      margin-bottom: 14px;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
      animation: bounce 2.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.06); }
    }

    .meme-title {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85), 0 0 2px #000;
      background: rgba(0,0,0,0.35);
      padding: 12px 16px;
      border-radius: 16px;
      backdrop-filter: blur(4px);
    }

    /* Правая панель действий */
    .actions-col {
      position: absolute;
      right: 12px;
      bottom: 86px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .avatar-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    .follow-badge {
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fe2c55;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }

    .follow-badge.subscribed {
      background: #22c55e;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .action-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.15s;
    }

    .action-btn:active .action-icon {
      transform: scale(0.85);
    }

    .action-btn.liked .action-icon {
      color: #fe2c55;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Нижнее описание ролика */
    .video-meta {
      position: absolute;
      left: 14px;
      right: 76px;
      bottom: 78px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .real-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      background: rgba(34, 197, 94, 0.25);
      border: 1px solid rgba(34, 197, 94, 0.6);
      color: #86efac;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .author-name {
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .video-caption {
      font-size: 14px;
      line-height: 1.35;
      color: rgba(255,255,255,0.92);
    }

    .video-tags {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Сердечко по двойному тапу */
    .double-tap-heart {
      position: absolute;
      font-size: 84px;
      z-index: 25;
      pointer-events: none;
      animation: popHeart 0.7s ease-out forwards;
    }

    @keyframes popHeart {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
    }

    /* Нижняя навигация */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: #09090b;
      border-top: 1px solid #27272a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #71717a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #fff;
    }

    .nav-btn span.ico {
      font-size: 20px;
    }

    .create-btn {
      width: 44px;
      height: 30px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-size: 22px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      box-shadow: -3px 0 0 #25f4ee, 3px 0 0 #fe2c55;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Модальные окна и внутренние экраны */
    .page-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 64px 16px 84px;
    }

    .card-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #fe2c55, #ff5e3a);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Шторка комментариев */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
    }
    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-panel {
      background: #18181b;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      height: 68%;
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
      font-weight: 800;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .comment-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
      background: #27272a;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .comment-author {
      font-size: 12px;
      font-weight: 700;
      color: #a1a1aa;
      margin-bottom: 2px;
    }

    .comment-text {
      font-size: 14px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #27272a;
    }

    .comment-form input {
      flex: 1;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
    }

    .comment-form button {
      background: #fe2c55;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0 16px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Сетка профиля и трендов */
    .grid-posts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 12px;
    }

    .grid-item {
      aspect-ratio: 9 / 14;
      background: #27272a;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .grid-item img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65;
    }

    .grid-item-content {
      position: relative;
      z-index: 2;
      font-size: 11px;
      font-weight: 700;
      text-shadow: 0 1px 4px #000;
    }

    .toast {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #27272a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 90;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      display: none;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toast" class="toast"></div>

  <!-- Верхняя панель -->
  <div class="top-bar" id="top-bar">
    <div class="status-pill">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Подключение к облаку...</span>
    </div>
    <div class="feed-tabs">
      <button class="feed-tab" id="tab-following" onclick="switchFeedMode('following')">Подписки</button>
      <button class="feed-tab active" id="tab-foryou" onclick="switchFeedMode('foryou')">Рекомендации</button>
    </div>
  </div>

  <!-- Экран 1: Лента -->
  <div id="screen-feed" class="screen active">
    <div id="feed-container"></div>
  </div>

  <!-- Экран 2: Поиск и люди -->
  <div id="screen-discover" class="screen">
    <div class="page-scroll">
      <h2 style="margin-bottom: 10px;">Поиск и авторы</h2>
      <input type="text" id="search-input" class="input-field" placeholder="Поиск по нику, описанию или #хэштегу..." oninput="renderDiscover()" />
      <div id="users-list-box" class="card-box">
        <div style="font-weight:800; margin-bottom:10px;">Реальные авторы в сети</div>
        <div id="real-authors-list"></div>
      </div>
      <div id="discover-grid" class="grid-posts"></div>
    </div>
  </div>

  <!-- Экран 3: Создание ролика -->
  <div id="screen-create" class="screen">
    <div class="page-scroll">
      <h2 style="margin-bottom: 12px;">Новый ролик</h2>
      <div class="card-box">
        <label style="font-size:13px; color:#a1a1aa;">Стикер / эмодзи ролика</label>
        <input type="text" id="post-emoji" class="input-field" value="🔥" maxlength="4" />

        <label style="font-size:13px; color:#a1a1aa;">Текст на экране (мем / заголовок)</label>
        <input type="text" id="post-title" class="input-field" placeholder="Например: Когда зашёл в свой ТикТак с друзьями" />

        <label style="font-size:13px; color:#a1a1aa;">Описание и хэштеги</label>
        <textarea id="post-caption" class="textarea-field" rows="2" placeholder="Всем привет! #рек #тиктак #друзья"></textarea>

        <label style="font-size:13px; color:#a1a1aa;">Фоновая тема</label>
        <select id="post-theme" class="select-field">
          <option value="neon">Неоновый закат</option>
          <option value="cyber">Киберпанк матрица</option>
          <option value="ocean">Глубокий океан</option>
          <option value="fire">Огненный вайб</option>
          <option value="purple">Космос</option>
        </select>

        <label style="font-size:13px; color:#a1a1aa;">Или загрузи фото с устройства (необязательно)</label>
        <input type="file" id="post-image" accept="image/*" class="input-field" />

        <button class="primary-btn" onclick="publishPost()">Опубликовать для всех 🚀</button>
      </div>
    </div>
  </div>

  <!-- Экран 4: Профиль (свой или друга) -->
  <div id="screen-profile" class="screen">
    <div class="page-scroll">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 id="profile-header-title">Мой профиль</h2>
        <button id="back-to-my-profile" class="secondary-btn" style="display:none;" onclick="openMyProfile()">Мой аккаунт</button>
      </div>

      <div class="card-box" style="text-align:center;">
        <div id="profile-avatar" style="width:74px; height:74px; border-radius:50%; background:#27272a; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:36px; border:2px solid #fe2c55;">😎</div>
        <div id="profile-name" style="font-size:20px; font-weight:900;">@user</div>
        <div id="profile-bio" style="font-size:13px; color:#a1a1aa; margin-top:4px;">Снимаю годный контент</div>

        <div style="display:flex; justify-content:center; gap:24px; margin:16px 0;">
          <div><div id="stat-posts" style="font-weight:900; font-size:17px;">0</div><div style="font-size:11px; color:#a1a1aa;">Ролики</div></div>
          <div><div id="stat-followers" style="font-weight:900; font-size:17px;">0</div><div style="font-size:11px; color:#a1a1aa;">Подписчики</div></div>
          <div><div id="stat-likes" style="font-weight:900; font-size:17px;">0</div><div style="font-size:11px; color:#a1a1aa;">Лайки</div></div>
        </div>

        <div id="my-profile-controls">
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <input type="text" id="edit-avatar" class="input-field" style="width:64px; margin:0; text-align:center;" maxlength="4" />
            <input type="text" id="edit-name" class="input-field" style="flex:1; margin:0;" placeholder="Твой никнейм" />
          </div>
          <input type="text" id="edit-bio" class="input-field" style="margin-top:0;" placeholder="Статус / описание профиля" />
          <div style="display:flex; gap:8px;">
            <button class="secondary-btn" style="flex:1;" onclick="saveProfile()">Сохранить профиль</button>
            <button class="secondary-btn" style="flex:1; background:#fe2c55; border:none;" onclick="copyInviteLink()">Позвать друга 🔗</button>
          </div>
        </div>

        <div id="other-profile-controls" style="display:none;">
          <button id="profile-follow-btn" class="primary-btn" onclick="toggleFollowViewedUser()">Подписаться</button>
        </div>
      </div>

      <h3 style="font-size:15px; margin-top:10px;">Опубликованные ролики</h3>
      <div id="profile-posts-grid" class="grid-posts"></div>
    </div>
  </div>

  <!-- Шторка комментариев -->
  <div id="comments-drawer" class="drawer-backdrop" onclick="if(event.target===this) closeComments()">
    <div class="drawer-panel">
      <div class="drawer-header">
        <span id="comments-title">Комментарии</span>
        <button onclick="closeComments()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="comments-list" class="comments-list"></div>
      <div class="comment-form">
        <input type="text" id="comment-input" placeholder="Написать комментарий..." onkeydown="if(event.key==='Enter') sendComment()" />
        <button onclick="sendComment()">➤</button>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-feed" onclick="switchScreen('feed')"><span class="ico">🏠</span>Главная</button>
    <button class="nav-btn" id="nav-discover" onclick="switchScreen('discover')"><span class="ico">🔍</span>Друзья</button>
    <button class="create-btn" onclick="switchScreen('create')">+</button>
    <button class="nav-btn" id="nav-profile" onclick="openMyProfile()"><span class="ico">👤</span>Профиль</button>
  </div>
</div>

  // Инициализация Firebase и синхронизация
  async function initCloud() {
    try {
      await signInAnonymously(auth);
    } catch (e) {
      console.warn("Анонимный вход не включён в Firebase Console, работаем по открытым правилам:", e.message);
    }

    onAuthStateChanged(auth, (user) => {
      if (user && !localProfile.uid.startsWith("firebase_")) {
        localProfile.uid = "firebase_" + user.uid;
        localStorage.setItem("tiktak_user", JSON.stringify(localProfile));
      }
      syncUserProfileToCloud();
    });

    // Пробуем Firestore
    try {
      const q = query(collection(db, "tiktak_posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snap) => {
        realPosts = snap.docs.map(d => ({ id: d.id, isReal: true, ...d.data() }));
        setCloudStatus("firestore", `Онлайн • Роликов друзей: ${realPosts.length}`);
        renderFeed();
        renderDiscover();
        if (document.getElementById("screen-profile").classList.contains("active")) {
          renderProfile(viewedUserId);
        }
      }, (err) => {
        console.warn("Firestore недоступен, переключаемся на Realtime Database:", err.message);
        initRealtimeFallback();
      });

      onSnapshot(collection(db, "tiktak_users"), (snap) => {
        snap.docs.forEach(d => { usersMap[d.id] = d.data(); });
        renderDiscover();
      });
    } catch (e) {
      initRealtimeFallback();
    }
  }

  // Резервное подключение через Realtime Database (которая уже создана в проекте)
  function initRealtimeFallback() {
    rtdbOnValue(rtdbRef(rtdb, "tiktak_posts"), (snap) => {
      const val = snap.val() || {};
      realPosts = Object.entries(val)
        .map(([id, data]) => ({ id, isReal: true, ...data }))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setCloudStatus("rtdb", `Онлайн (RTDB) • Роликов: ${realPosts.length}`);
      renderFeed();
      renderDiscover();
    }, (err) => {
      setCloudStatus("offline", "Локальный режим (проверь Rules в Firebase)");
    });

    rtdbOnValue(rtdbRef(rtdb, "tiktak_users"), (snap) => {
      usersMap = snap.val() || {};
      renderDiscover();
    });
  }

    usersMap[localProfile.uid] = localProfile;
    try {
      await setDoc(doc(db, "tiktak_users", localProfile.uid), localProfile, { merge: true });
    } catch (_) {}
    try {
      await rtdbSet(rtdbRef(rtdb, "tiktak_users/" + localProfile.uid), localProfile);
    } catch (_) {}
  }

    // Чередуем реальные ролики с бесконечными рекомендациями, но реальные всегда в начале
    return combined;
  }

  // Лайки
  window.toggleLike = async function(postId) {
    const isLiked = likedPosts.has(postId);
    const delta = isLiked ? -1 : 1;
    if (isLiked) likedPosts.delete(postId);
    else likedPosts.add(postId);
    localStorage.setItem("tiktak_likes", JSON.stringify([...likedPosts]));

    const gen = generatedPosts.find(p => p.id === postId);
    if (gen) {
      gen.likes = Math.max(0, (gen.likes || 0) + delta);
      renderFeed();
      return;
    }

    const real = realPosts.find(p => p.id === postId);
    if (real) {
      real.likes = Math.max(0, (real.likes || 0) + delta);
      renderFeed();
      try {
        await updateDoc(doc(db, "tiktak_posts", postId), { likes: increment(delta) });
      } catch (_) {
        try {
          await rtdbUpdate(rtdbRef(rtdb, "tiktak_posts/" + postId), { likes: real.likes });
        } catch (__) {}
      }
    }
  };

      showToast("Ролик опубликован в общую ленту! 🚀");

      try {
        const newRef = rtdbPush(rtdbRef(rtdb, "tiktak_posts"));

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 540;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  };

  window.copyInviteLink = function() {
    navigator.clipboard?.writeText(window.location.href);
    showToast("Ссылка скопирована! Отправь другу 🔗");
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'");
  }

  // Старт
  generateMorePosts(8);
  renderFeed();
  initCloud();
</script>
</body>
</html>
